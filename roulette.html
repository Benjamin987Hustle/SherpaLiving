<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roulette Européenne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(ellipse at center, #0d3d1a 0%, #061208 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      color: #f5e6c8;
      overflow: hidden;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #c9a84c;
      text-shadow: 0 0 20px rgba(201, 168, 76, 0.5);
      margin-bottom: 2rem;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .wheel-wrapper {
      position: relative;
      width: 500px;
      height: 500px;
    }

    canvas#wheel {
      position: absolute;
      top: 0; left: 0;
      border-radius: 50%;
      box-shadow:
        0 0 0 8px #8b6914,
        0 0 0 14px #c9a84c,
        0 0 0 18px #8b6914,
        0 0 40px rgba(0,0,0,0.8);
    }

    .ball-track {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    .marker {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 22px solid #c9a84c;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
      z-index: 10;
    }

    .result-panel {
      text-align: center;
      min-height: 100px;
    }

    .result-number {
      font-size: 5rem;
      font-weight: bold;
      line-height: 1;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .result-number.show {
      opacity: 1;
      transform: scale(1);
    }

    .result-number.red   { color: #e63946; text-shadow: 0 0 20px rgba(230,57,70,0.6); }
    .result-number.black { color: #c8c8c8; text-shadow: 0 0 20px rgba(200,200,200,0.4); }
    .result-number.green { color: #4caf50; text-shadow: 0 0 20px rgba(76,175,80,0.6); }

    .result-label {
      font-size: 1rem;
      letter-spacing: 0.2em;
      color: #c9a84c;
      margin-top: 0.3rem;
      opacity: 0;
      transition: opacity 0.5s ease 0.3s;
    }

    .result-label.show { opacity: 1; }

    .spin-btn {
      padding: 1rem 3.5rem;
      font-size: 1.2rem;
      font-family: 'Georgia', serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #c9a84c, #8b6914, #c9a84c);
      color: #1a0e00;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 20px rgba(201, 168, 76, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
      transition: transform 0.1s, box-shadow 0.1s, opacity 0.3s;
    }

    .spin-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(201, 168, 76, 0.6), inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .spin-btn:active:not(:disabled) { transform: translateY(0); }
    .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .history {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 500px;
    }

    .history-item {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      border: 2px solid rgba(255,255,255,0.2);
      animation: pop-in 0.3s ease;
    }

    .history-item.red   { background: #c0392b; }
    .history-item.black { background: #2c2c2c; }
    .history-item.green { background: #1a7a2e; }

    @keyframes pop-in {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .history-label {
      font-size: 0.75rem;
      color: #c9a84c;
      letter-spacing: 0.15em;
      opacity: 0.7;
      margin-bottom: 0.3rem;
    }
  </style>
</head>
<body>

<div class="game-container">
  <h1>Roulette Européenne</h1>

  <div class="wheel-wrapper">
    <div class="marker"></div>
    <canvas id="wheel" width="500" height="500"></canvas>
    <canvas id="ballCanvas" class="ball-track" width="500" height="500"></canvas>
  </div>

  <div class="result-panel">
    <div class="result-number" id="resultNumber">—</div>
    <div class="result-label" id="resultLabel"></div>
  </div>

  <button class="spin-btn" id="spinBtn">Lancer</button>

  <div>
    <div class="history-label" id="historyLabel"></div>
    <div class="history" id="history"></div>
  </div>
</div>

<script>
const POCKETS = [
  0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,
  24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26
];
const N = POCKETS.length;
const RED_NUMS = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);

function getColor(n) {
  if (n === 0) return 'green';
  return RED_NUMS.has(n) ? 'red' : 'black';
}

const SECTOR = (2 * Math.PI) / N;

const wheelCanvas = document.getElementById('wheel');
const ballCanvas  = document.getElementById('ballCanvas');
const wCtx = wheelCanvas.getContext('2d');
const bCtx = ballCanvas.getContext('2d');
const CX = wheelCanvas.width  / 2;
const CY = wheelCanvas.height / 2;
const R  = CX - 4;

function drawWheel(rotation) {
  wCtx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);

  wCtx.beginPath();
  wCtx.arc(CX, CY, R, 0, 2 * Math.PI);
  wCtx.fillStyle = '#1a0e00';
  wCtx.fill();

  for (let i = 0; i < N; i++) {
    const startAngle = rotation + i * SECTOR - SECTOR / 2;
    const endAngle   = startAngle + SECTOR;
    const num = POCKETS[i];
    const col = getColor(num);

    wCtx.beginPath();
    wCtx.moveTo(CX, CY);
    wCtx.arc(CX, CY, R - 2, startAngle, endAngle);
    wCtx.closePath();

    if (col === 'green')    wCtx.fillStyle = '#1a7a2e';
    else if (col === 'red') wCtx.fillStyle = '#c0392b';
    else                    wCtx.fillStyle = '#1e1e1e';
    wCtx.fill();

    wCtx.beginPath();
    wCtx.moveTo(CX, CY);
    wCtx.arc(CX, CY, R - 2, startAngle, startAngle + 0.01);
    wCtx.closePath();
    wCtx.strokeStyle = '#c9a84c';
    wCtx.lineWidth = 1.2;
    wCtx.stroke();

    wCtx.save();
    wCtx.translate(CX, CY);
    wCtx.rotate(startAngle + SECTOR / 2);
    wCtx.textAlign = 'right';
    wCtx.textBaseline = 'middle';
    wCtx.fillStyle = '#ffffff';
    wCtx.font = 'bold 11px Arial';
    wCtx.fillText(num, R - 10, 0);
    wCtx.restore();
  }

  wCtx.beginPath();
  wCtx.arc(CX, CY, R * 0.72, 0, 2 * Math.PI);
  wCtx.strokeStyle = '#c9a84c';
  wCtx.lineWidth = 3;
  wCtx.stroke();

  wCtx.beginPath();
  wCtx.arc(CX, CY, R * 0.7, 0, 2 * Math.PI);
  wCtx.fillStyle = '#0d2010';
  wCtx.fill();

  wCtx.beginPath();
  wCtx.arc(CX, CY, R * 0.68, 0, 2 * Math.PI);
  wCtx.strokeStyle = '#8b6914';
  wCtx.lineWidth = 2;
  wCtx.stroke();

  wCtx.beginPath();
  wCtx.arc(CX, CY, 22, 0, 2 * Math.PI);
  const hubGrad = wCtx.createRadialGradient(CX - 5, CY - 5, 2, CX, CY, 22);
  hubGrad.addColorStop(0, '#f0d060');
  hubGrad.addColorStop(1, '#8b6914');
  wCtx.fillStyle = hubGrad;
  wCtx.fill();
  wCtx.strokeStyle = '#1a0e00';
  wCtx.lineWidth = 2;
  wCtx.stroke();
}

function drawBall(angle, trackR) {
  bCtx.clearRect(0, 0, ballCanvas.width, ballCanvas.height);
  const x = CX + Math.cos(angle) * trackR;
  const y = CY + Math.sin(angle) * trackR;

  const glow = bCtx.createRadialGradient(x, y, 1, x, y, 10);
  glow.addColorStop(0, 'rgba(255,255,255,0.6)');
  glow.addColorStop(1, 'rgba(255,255,255,0)');
  bCtx.beginPath();
  bCtx.arc(x, y, 10, 0, 2 * Math.PI);
  bCtx.fillStyle = glow;
  bCtx.fill();

  const ballGrad = bCtx.createRadialGradient(x - 2, y - 2, 1, x, y, 7);
  ballGrad.addColorStop(0, '#ffffff');
  ballGrad.addColorStop(0.6, '#d0d0d0');
  ballGrad.addColorStop(1, '#808080');
  bCtx.beginPath();
  bCtx.arc(x, y, 7, 0, 2 * Math.PI);
  bCtx.fillStyle = ballGrad;
  bCtx.fill();
}

let spinning   = false;
let wheelAngle = 0;
let ballAngle  = 0;
let ballTrackR = R - 14;
let animFrame  = null;

drawWheel(0);
bCtx.clearRect(0, 0, ballCanvas.width, ballCanvas.height);

document.getElementById('spinBtn').addEventListener('click', () => {
  if (spinning) return;
  spinning = true;

  const btn = document.getElementById('spinBtn');
  btn.disabled = true;

  document.getElementById('resultNumber').classList.remove('show');
  document.getElementById('resultLabel').classList.remove('show');

  const winIndex = Math.floor(Math.random() * N);
  const winNum   = POCKETS[winIndex];

  const totalWheelSpins   = Math.floor(5 + Math.random() * 4);
  const targetWheelAngle  = -(Math.PI / 2) - winIndex * SECTOR - totalWheelSpins * 2 * Math.PI;
  const spinDuration      = 6000 + Math.random() * 2000;
  const startTime         = performance.now();
  const startWheelAngle   = wheelAngle;

  ballTrackR = R - 14;
  ballAngle  = Math.random() * 2 * Math.PI;
  const startBallAngle = ballAngle;

  // Compute ball travel so it lands exactly at -π/2 (top = under the marker)
  const TARGET_BALL = -Math.PI / 2;
  let delta = TARGET_BALL - startBallAngle;
  delta = ((delta % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  if (delta > 0) delta -= 2 * Math.PI; // force counterclockwise
  const extraBallSpins  = 5 + Math.floor(Math.random() * 4); // 5–8 full extra spins
  const totalBallTravel = delta - extraBallSpins * 2 * Math.PI;

  function easeOut(t)   { return 1 - Math.pow(1 - t, 3); }
  function easeInOut(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }

  function animate(now) {
    const elapsed = now - startTime;
    const t       = Math.min(elapsed / spinDuration, 1);
    const eased   = easeOut(t);

    wheelAngle = startWheelAngle + (targetWheelAngle - startWheelAngle) * eased;

    const ballT     = Math.min(elapsed / (spinDuration * 0.85), 1);
    const ballEased = easeOut(ballT);
    ballAngle = startBallAngle + totalBallTravel * ballEased;

    const inwardT = Math.max(0, (t - 0.6) / 0.4);
    const innerR  = R * 0.75 + 10;
    ballTrackR = (R - 14) - (R - 14 - innerR) * easeInOut(inwardT);

    drawWheel(wheelAngle);
    drawBall(ballAngle, ballTrackR);

    if (t < 1) {
      animFrame = requestAnimationFrame(animate);
    } else {
      wheelAngle = targetWheelAngle;
      drawWheel(wheelAngle);
      ballTrackR = innerR;
      drawBall(TARGET_BALL, ballTrackR); // snap ball exactly under the marker

      spinning = false;
      btn.disabled = false;
      showResult(winNum);
      addHistory(winNum);
    }
  }

  animFrame = requestAnimationFrame(animate);
});

function showResult(num) {
  const col = getColor(num);
  const el  = document.getElementById('resultNumber');
  const lbl = document.getElementById('resultLabel');

  el.textContent = num;
  el.className   = 'result-number ' + col;
  lbl.textContent = col === 'green' ? '🟢 Zéro' : col === 'red' ? '🔴 Rouge' : '⚫ Noir';

  setTimeout(() => {
    el.classList.add('show');
    lbl.classList.add('show');
  }, 100);
}

function addHistory(num) {
  const col       = getColor(num);
  const container = document.getElementById('history');
  const label     = document.getElementById('historyLabel');

  label.textContent = 'Derniers résultats';

  const dot = document.createElement('div');
  dot.className   = 'history-item ' + col;
  dot.textContent = num;
  container.prepend(dot);

  while (container.children.length > 15) container.removeChild(container.lastChild);
}
</script>
</body>
</html>
